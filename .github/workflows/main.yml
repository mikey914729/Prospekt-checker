name: Automatische Prospekt Aktualisierung
on:
schedule:
# Führt das Skript jeden Montag um 01:00 Uhr nachts aus
cron: '0 1 * * 1'
workflow_dispatch: # Erlaubt es uns, den Roboter auch manuell per Knopfdruck zu starten
jobs:
refresh-data:
runs-on: ubuntu-latest
steps:
name: Code auschecken
uses: actions/checkout@v4
name: Python einrichten
uses: actions/setup-python@v5
with:
python-python-version: '3.10'
name: Skript ausführen
run: python scraper.py
name: Änderungen auf GitHub speichern
run: |
git config --global user.name "ProspektBot"
git config --global user.email "bot@github.com"
git add daten.json
git commit -m "Angebote automatisch aktualisiert" || exit 0
git push
